<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18"><title>WatchDog · 网络看门狗</title>
<link rel="stylesheet" href="/ui.css">
</head><body>
<div class="w">
<header>
  <div class="lg"><svg viewBox="0 0 24 24"><path d="M3 12h3l2-5 3 10 2.5-7 1.8 4H21"/></svg></div>
  <div class="hd"><h1>网络看门狗</h1><p id="sub">正在读取状态…</p></div>
  <span class="pill" id="pill"><i class="dot"></i><span id="pillTxt">检测中</span></span>
</header>

<div class="grid">
  <div class="tile"><div class="k">当前延迟</div><div class="v" id="rtt">—</div></div>
  <div class="tile"><div class="k">网关</div><div class="v" id="gw">—</div></div>
  <div class="tile"><div class="k">信号</div><div class="v" id="rssi">—</div></div>
  <div class="tile"><div class="k">24h 可用率</div><div class="v ok" id="up">—</div></div>
  <div class="tile"><div class="k">p95 延迟</div><div class="v" id="p95">—</div></div>
  <div class="tile"><div class="k">抖动</div><div class="v" id="jitter">—</div></div>
</div>

<section class="card">
  <div class="ch"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 3-5 6 7"/><path d="M3 21h18"/></svg></span>
    <h2>延迟趋势</h2><span class="sub" id="rangeTip">最近 24 小时</span>
    <button class="btn ghost sm" id="btnRange" type="button">切换范围</button></div>
  <canvas id="chart" height="170"></canvas>
  <div class="muted" id="chartTip" style="margin-top:8px">—</div>
</section>

<section class="card">
  <div class="ch"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 8v4"/><path d="M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg></span>
    <h2>断网记录</h2><span class="sub" id="outTip">—</span>
    <button class="btn ghost sm" id="btnClearOut" type="button">清空</button></div>
  <div id="outList"><div class="empty">暂无断网记录</div></div>
</section>

<section class="card">
  <div class="ch"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <h2>设备健康</h2><span class="sub" id="hTip">—</span></div>
  <div class="grid" id="hgrid">
    <div class="tile"><div class="k">复位原因</div><div class="v sm" id="hReason">—</div></div>
    <div class="tile"><div class="k">堆碎片</div><div class="v sm" id="hFrag">—</div></div>
    <div class="tile"><div class="k">WiFi 掉线</div><div class="v sm" id="hDrops">—</div></div>
    <div class="tile"><div class="k">关联尝试</div><div class="v sm" id="hTries">—</div></div>
    <div class="tile"><div class="k">上次探测</div><div class="v sm" id="hErr">—</div></div>
    <div class="tile"><div class="k">在用 WiFi</div><div class="v sm" id="hAp">—</div></div>
  </div>
  <div class="muted" id="hnote" style="margin-top:2px"></div>
</section>

<section class="card">
  <div class="ch"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>
    <h2>设置</h2><span class="sub" id="cfgTip"></span></div>
  <div class="row">
    <div><label>WiFi 名称</label><div class="inp"><input id="ssid" list="aps" placeholder="家里 WiFi"></div></div>
    <div><label>WiFi 密码</label><div class="inp"><input id="pass" type="password" placeholder="留空则不修改"></div></div>
  </div>
  <div class="row">
    <div><label>备用 WiFi 名称（可选）</label><div class="inp"><input id="ssid2" list="aps" placeholder="主 WiFi 连不上时自动切换"></div></div>
    <div><label>备用 WiFi 密码</label><div class="inp"><input id="pass2" type="password" placeholder="留空则不修改"></div></div>
  </div>
  <div class="row">
    <div style="align-self:flex-end"><button class="btn ghost sm" id="btnScan" type="button">扫描周边 WiFi</button></div>
    <div style="align-self:center"><label style="display:flex;align-items:center;gap:8px;margin:6px 2px 0"><input id="daily" type="checkbox" style="width:18px;height:18px"><span>每天 08:00 推送简报</span></label></div>
  </div>
  <div class="row">
    <div><label>探测目标（域名或 IP）</label><div class="inp"><input id="host" placeholder="www.baidu.com"></div></div>
    <div><label>DNS 服务器</label><div class="inp"><input id="dns" placeholder="223.5.5.5"></div></div>
  </div>
  <div class="row">
    <div><label>固定 IP（留空 = DHCP）</label><div class="inp"><input id="ip" placeholder="例如 192.168.1.100"></div></div>
    <div><label>网关</label><div class="inp"><input id="gw" placeholder="192.168.1.1"></div></div>
    <div><label>子网掩码</label><div class="inp"><input id="mask" placeholder="255.255.255.0"></div></div>
  </div>
  <div class="row">
    <div><label>采样间隔（秒）</label><div class="inp"><input id="interval" type="number" min="10" max="3600" placeholder="60"></div></div>
    <div><label>网页密码（留空=不修改）</label><div class="inp"><input id="webpass" type="password" placeholder="留空则保持不变"></div></div>
  </div>
  <div class="row">
    <div style="align-self:center"><label style="display:flex;align-items:center;gap:8px;margin:2px 2px 12px"><input id="clearWeb" type="checkbox" style="width:18px;height:18px"><span>清除网页密码</span></label></div>
    <div></div>
  </div>
  <div class="row">
    <div style="flex:1"><label>Server 酱 SendKey（留空 = 不修改）</label><div class="inp"><input id="sendkey" placeholder="粘贴新的 SCT… 留空则保持不变" autocomplete="off" spellcheck="false"></div></div>
    <div style="align-self:flex-end"><button class="btn ghost sm" id="btnTestPush" type="button">测试推送</button></div>
  </div>
  <div class="row">
    <div style="align-self:center"><label style="display:flex;align-items:center;gap:8px;margin:2px 2px 12px"><input id="noPush" type="checkbox" style="width:18px;height:18px"><span>关闭断网推送（清空 SendKey）</span></label></div>
    <div></div>
  </div>
  <div class="row">
    <button class="btn" id="btnSave" type="button">保存并重启</button>
    <a class="btn ghost" href="/api/history" download="watchdog.csv" style="text-align:center;line-height:1.2;text-decoration:none">导出 CSV</a>
    <button class="btn ghost" id="btnFiles" type="button">文件服务器 →</button>
  </div>
</section>
<datalist id="aps"></datalist>

<footer id="foot">WatchDog</footer>
</div>
<div id="toast"></div>

<script src="/ui.js"></script>
<script>
(function () {
  var chart = $('chart'), ctx = chart.getContext('2d');
  var samples = [], rangeIdx = 2, ranges = [60, 360, 720], rangeNames = ['最近 1 小时', '最近 6 小时', '最近 24 小时'];
  var st = null;

  function dpr() {
    var r = window.devicePixelRatio || 1;
    var w = chart.clientWidth, h = 170;
    if (chart.width !== Math.round(w * r)) {
      chart.width = Math.round(w * r); chart.height = Math.round(h * r);
    }
    ctx.setTransform(r, 0, 0, r, 0, 0);
    return { w: w, h: h };
  }

  function draw() {
    var box = dpr(), w = box.w, h = box.h;
    ctx.clearRect(0, 0, w, h);
    var max = 0, i, list = samples.slice(-ranges[rangeIdx]);
    for (i = 0; i < list.length; i++) if (list[i].rtt > max) max = list[i].rtt;
    max = Math.max(120, Math.ceil(max / 50) * 50);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(139,151,184,.75)'; ctx.font = '10px ui-monospace,Menlo,monospace';
    for (i = 0; i <= 3; i++) {
      var y = 10 + (h - 30) * i / 3;
      ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(w - 4, y); ctx.stroke();
      ctx.fillText(String(Math.round(max - max * i / 3)), 2, y + 3);
    }
    if (!list.length) {
      ctx.fillStyle = 'rgba(139,151,184,.8)'; ctx.font = '13px sans-serif';
      ctx.fillText('还没有采样数据', w / 2 - 50, h / 2);
      return;
    }

    var step = (w - 40) / Math.max(1, list.length - 1);
    var px = function (k) { return 34 + k * step; };
    var py = function (v) { return 10 + (h - 30) * (1 - Math.min(v, max) / max); };

    // 断网底纹
    ctx.fillStyle = 'rgba(251,113,133,.12)';
    for (i = 0; i < list.length; i++) {
      if (!list[i].ok) {
        var j = i; while (j < list.length && !list[j].ok) j++;
        ctx.fillRect(px(i), 10, Math.max(2, (j - i) * step), h - 20);
        i = j - 1;
      }
    }

    // 折线
    ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2; ctx.beginPath();
    var started = false;
    for (i = 0; i < list.length; i++) {
      if (list[i].ok) {
        var x = px(i), y = py(list[i].rtt);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      } else started = false;
    }
    ctx.stroke();

    // 渐变填充
    ctx.lineTo(px(list.length - 1), h - 20); ctx.lineTo(px(0), h - 20); ctx.closePath();
    var g = ctx.createLinearGradient(0, 10, 0, h - 20);
    g.addColorStop(0, 'rgba(94,234,212,.28)'); g.addColorStop(1, 'rgba(94,234,212,0)');
    ctx.fillStyle = g; ctx.fill();

    // 时间标签
    ctx.fillStyle = 'rgba(139,151,184,.75)';
    var t0 = list[0].ts, t1 = list[list.length - 1].ts;
    var f = (t0 > 100000000) ? function (e) { return hhmm(e); } : function (e) { return e + 's'; };
    ctx.fillText(f(t0), 36, h - 6);
    var lab = f(t1), tw = ctx.measureText(lab).width;
    ctx.fillText(lab, w - tw - 4, h - 6);
  }

  // 断网记录来自固件落盘的 /outages.bin（重启不丢），不再只靠内存里的曲线推算
  function loadOutages() {
    reqJSON('/api/outages', function (d) {
      if (!d) return;
      var list = (d.items || []).slice().reverse();   // 新 → 旧
      $('outTip').textContent = d.total ? ('共 ' + d.total + ' 次 · 已落盘') : '暂无';
      if (!list.length) {
        $('outList').innerHTML = '<div class="empty">暂无断网记录（重启也不丢）</div>';
        return;
      }
      var html = '<table>', i;
      for (i = 0; i < list.length && i < 10; i++) {
        var o = list[i];
        html += '<tr><td class="n">' + (o.ts > 100000000 ? ddhhmm(o.ts) : ('启动后 ' + o.ts + 's')) + '</td>' +
                '<td><span class="tag bad">断网 ' + fmtDur(o.dur) + '</span></td>' +
                '<td class="n" style="text-align:right">' + (o.rssi ? (o.rssi + ' dBm') : '—') + '</td></tr>';
      }
      html += '</table>';
      $('outList').innerHTML = html;
    });
  }

  function loadHealth() {
    reqJSON('/api/health', function (h) {
      if (!h) { $('hTip').textContent = '读取失败'; return; }
      $('hTip').textContent = 'heap ' + Math.round(h.heap / 1024) + 'KB · 运行 ' + fmtDur(h.uptime);
      $('hReason').textContent = h.reason_txt + (h.reason === 2 || h.reason === 1 ? (' #' + h.exccause) : '');
      $('hFrag').textContent = h.frag + '%';
      $('hFrag').className = 'v sm' + (h.frag > 60 ? ' warn' : ' ok');
      $('hDrops').textContent = h.drops + ' 次';
      $('hDrops').className = 'v sm' + (h.drops > 5 ? ' warn' : '');
      $('hTries').textContent = h.tries + ' 次';
      $('hErr').textContent = h.last_err === 0 ? '正常' : (h.last_err === 2 ? '局域网断' : '外网断');
      $('hErr').className = 'v sm' + (h.last_err === 0 ? ' ok' : ' bad');
      $('hAp').textContent = (h.ap || '—') + (h.has_backup ? (h.ap_idx ? '（备用）' : '（主）') : '');
      $('hnote').textContent = '看护阈值：heap < ' + h.guard_kb + 'KB 持续 5 分钟自动重启 · 复位计数 ' + h.reason_txt;
    });
  }

  function paintStatus(d) {
    st = d;
    var ok = d.ok && d.mode === 'sta';
    $('pill').className = 'pill' + (ok ? '' : ' bad');
    $('pillTxt').textContent = d.mode === 'setup' ? '配网模式' :
      (ok ? '网络正常' : (d.err === 2 ? '局域网断开' : '外网中断'));
    $('sub').textContent = (d.ssid || '未连接') + ' · ' + (d.ip || '—') + ' · 运行 ' + fmtDur(d.uptime);

    $('rtt').textContent = d.rtt ? (d.rtt + ' ms') : '超时';
    $('rtt').className = 'v' + (d.rtt ? (d.rtt > 200 ? ' warn' : ' ok') : ' bad');
    $('gw').textContent = d.gw_rtt ? (d.gw_rtt + ' ms') : '无响应';
    $('rssi').textContent = (d.rssi || 0) + ' dBm';
    $('p95').textContent = d.p95 ? (d.p95 + ' ms') : '—';
    $('p95').className = 'v' + (d.p95 ? (d.p95 > 200 ? ' warn' : ' ok') : '');
    $('jitter').textContent = d.jitter ? (d.jitter + ' ms') : '—';
    $('jitter').className = 'v' + (d.jitter > 40 ? ' warn' : '');
    $('up').textContent = (d.up_pct | 0) + '%';
    $('up').className = 'v' + (d.up_pct >= 99 ? ' ok' : (d.up_pct >= 95 ? ' warn' : ' bad'));
    $('foot').textContent = 'WatchDog v' + d.ver + ' · 采样 ' + d.samples + ' 点 · 内存 ' + Math.round(d.heap / 1024) + 'KB' +
      ' · 每 ' + d.interval + ' 秒探测 ' + d.host;
  }

  function tick() {
    reqJSON('/api/status', function (d) {
      if (!d) { $('pill').className = 'pill bad'; $('pillTxt').textContent = '连接中断'; return; }
      paintStatus(d);
    });
  }

  function loadHistory() {
    req('/api/history', {}, function (t) {
      if (!t) return;
      var lines = t.split('\n'), out = [];
      for (var i = 0; i < lines.length; i++) {
        var p = lines[i].split(',');
        if (p.length < 3) continue;
        out.push({ ts: +p[0], rtt: +p[1], ok: p[2] === '1' });
      }
      samples = out;
      draw();
    });
  }

  function loadConfig() {
    reqJSON('/api/config', function (c) {
      if (!c) return;
      $('ssid').value = c.ssid || '';
      $('ssid2').value = c.ssid2 || '';
      $('host').value = c.host || '';
      $('dns').value = c.dns || '';
      $('ip').value = c.ip || '';
      $('gw').value = c.gw || '';
      $('mask').value = c.mask || '';
      $('interval').value = c.interval || 60;
      $('daily').checked = !!c.daily;
      $('clearWeb').checked = false;
      $('noPush').checked = false;
      var tips = [];
      if (c.has_sendkey) tips.push('已配推送'); else tips.push('未配推送');
      if (c.has_pass) tips.push('已设密码');
      if (c.has_pass2) tips.push('有备用 WiFi');
      $('cfgTip').textContent = tips.join(' · ');
    });
  }

  $('btnClearOut').onclick = function () {
    if (!confirm('清空全部断网记录？清空后无法恢复')) return;
    var b = this; b.disabled = true;
    req('/api/clear?what=outages', {}, function () {
      b.disabled = false;
      toast('断网记录已清空');
      loadOutages();
    });
  };

  $('btnScan').onclick = function () {
    var b = this; b.disabled = true; b.textContent = '扫描中…';
    reqJSON('/api/scan', function (d) {
      b.disabled = false; b.textContent = '扫描周边 WiFi';
      if (!d || !d.nets) { toast('扫描失败'); return; }
      var dl = $('aps'), i, seen = {};
      dl.innerHTML = '';
      var n = 0;
      for (i = 0; i < d.nets.length; i++) {
        var s = d.nets[i].s;
        if (!s || seen[s]) continue;
        seen[s] = 1; n++;
        var o = document.createElement('option');
        o.value = s; o.label = s + '  ' + d.nets[i].r + 'dBm';
        dl.appendChild(o);
      }
      toast('扫描到 ' + n + ' 个 WiFi，输入框可直接选');
    });
  };

  $('btnTestPush').onclick = function () {
    var b = this; b.disabled = true; b.textContent = '发送中…';
    req('/api/testpush', { method: 'POST' }, function (t) {
      b.disabled = false; b.textContent = '测试推送';
      var ok = t && t.ok;
      toast(ok ? '已发送，请查微信' : '发送失败（SendKey 无效或未填）');
    });
  };

  $('btnRange').onclick = function () {
    rangeIdx = (rangeIdx + 1) % ranges.length;
    $('rangeTip').textContent = rangeNames[rangeIdx];
    draw();
  };
  $('btnSave').onclick = function () {
    var body = 'ssid=' + encodeURIComponent($('ssid').value) +
               '&pass=' + encodeURIComponent($('pass').value) +
               '&ssid2=' + encodeURIComponent($('ssid2').value) +
               '&pass2=' + encodeURIComponent($('pass2').value) +
               '&host=' + encodeURIComponent($('host').value) +
               '&dns=' + encodeURIComponent($('dns').value) +
               '&ip=' + encodeURIComponent($('ip').value.trim()) +
               '&gw=' + encodeURIComponent($('gw').value.trim()) +
               '&mask=' + encodeURIComponent($('mask').value.trim()) +
               '&interval=' + encodeURIComponent($('interval').value) +
               '&webpass=' + encodeURIComponent($('webpass').value) +
               ($('clearWeb').checked ? '&webpass_clear=1' : '') +
               ($('noPush').checked ? '&sendkey_clear=1' : '') +
               '&daily=' + ($('daily').checked ? '1' : '0') +
               '&sendkey=' + encodeURIComponent($('sendkey').value);
    toast('保存中…');
    req('/api/config', { method: 'POST', body: body }, function () {
      toast('已保存，设备重启中');
      setTimeout(function () { location.reload(); }, 8000);
    });
  };
  $('btnFiles').onclick = function () { location.href = '/files'; };

  window.addEventListener('resize', draw);
  tick(); loadHistory(); loadConfig(); loadHealth(); loadOutages();
  setInterval(tick, 5000);
  setInterval(loadHistory, 60000);
  setInterval(loadHealth, 15000);
  setInterval(loadOutages, 60000);
})();
</script>
</body></html>
